# Simplified BuildingPro Suites environment to develop and test apps against API v2.
# The database is generated from the platform version in init/VERSION, see scripts/generate.sh.
#
#   API_ENDPOINT=http://localhost:3000/v2   API_TOKEN=secret   BROKERS=localhost:19092
#   CONNECTION_STRING=postgres://postgres:secret@localhost:5432/postgres

name: eliona-mock

networks:
  eliona-mock-network:
    name: eliona-mock-network

services:
  database:
    image: timescale/timescaledb-ha:pg16.15-ts2.31.0
    container_name: eliona-mock-database
    networks: [eliona-mock-network]
    command: ["-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: secret
      TZ: Europe/Zurich
    volumes:
      - ./init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./init/10-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./init/20-data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
      - ./init/30-mock.sql:/docker-entrypoint-initdb.d/30-mock.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -Atc 'select 1 from public.heap limit 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: eliona-mock-kafka
    networks: [eliona-mock-network]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://eliona-mock-kafka:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: eliona-mock-init-topics
    networks: [eliona-mock-network]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["rpk", "topic", "create", "-X", "brokers=eliona-mock-kafka:9092", "-r", "1", "-p", "1",
                 "eliona.calculator.raw.v1", "eliona.public.heap", "eliona.public.heap.output", "eliona.public.asset", "eliona.public.alarm"]
    restart: "no"

  api-v2:
    image: eliona/api-v2:v26.4.3
    platform: linux/amd64
    container_name: eliona-mock-api-v2
    networks: [eliona-mock-network]
    depends_on:
      database:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      USE_CONNECTION_STRING: "true"
      CONNECTION_STRING: postgres://postgres:secret@eliona-mock-database:5432/postgres
      BROKERS: eliona-mock-kafka:9092
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Writes data from eliona.calculator.raw.v1 into public.heap, like the platform calculator.
  calculator:
    image: insolare/mockprocessor:v26
    container_name: eliona-mock-calculator
    networks: [eliona-mock-network]
    depends_on:
      database:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      CONNECTION_STRING: postgres://postgres:secret@eliona-mock-database:5432/postgres
      BROKERS: eliona-mock-kafka:9092
    restart: unless-stopped

  # Change data capture for the API v2 listeners (assets, data, alarms).
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: eliona-mock-debezium
    networks: [eliona-mock-network]
    depends_on:
      database:
        condition: service_healthy
      init-topics:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: eliona-mock-kafka:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: eliona.debezium.configs
      OFFSET_STORAGE_TOPIC: eliona.debezium.offsets
      STATUS_STORAGE_TOPIC: eliona.debezium.statuses
    volumes:
      - ./init/debezium.sh:/debezium.sh:ro
      - ./init/eliona-connector.json:/eliona-connector.json:ro
    entrypoint: ["bash", "/debezium.sh"]
    restart: unless-stopped
