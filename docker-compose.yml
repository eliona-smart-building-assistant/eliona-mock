# Use this docker-compose.yml to start a simplified Eliona environment for mocking purposes. This mock
# provides a database and an Eliona API endpoint. Both can be used to develop and test apps and other
# components of Eliona against an Eliona environment

networks:
  eliona-mock-network:
    name: eliona-mock-network

volumes:
  eliona-mock-redpanda-data: null

services:
  # Simplified Eliona database as backend.
  # CONNECTION_STRING=postgres://postgres:secret@database:5432
  # CONNECTION_STRING=postgres://postgres:secret@localhost:5432
  database:
    image: debezium/postgres:12
    container_name: eliona-mock-database
    networks:
      eliona-mock-network:
    environment:
      POSTGRES_PASSWORD: secret
      PGPORT: 5432
      TZ: Europe/Zurich
    volumes:
      - ./init/database.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    # ports:
    #   - "5432:5432"

  # Server representing the Eliona API.
  # API_ENDPOINT=http://api-v2:3000/v2
  # API_ENDPOINT=http://localhost:3000/v2
  api-v2:
    image: eliona/api-v2:v26.2.9
    container_name: eliona-mock-api-v2
    networks:
      eliona-mock-network:
    depends_on:
      - database
    environment:
      CONNECTION_STRING: postgres://postgres:secret@eliona-mock-database:5432
      BROKERS: eliona-mock-redpanda:9092
    restart: always
    ports:
      - "3000:3000"

  # Kafka broker
  # BROKERS=kafka:9092
  # BROKERS=localhost:9092
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: eliona-mock-redpanda
    networks:
      eliona-mock-network:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://eliona-mock-redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://eliona-mock-redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr eliona-mock-redpanda:33145
      - --advertise-rpc-addr eliona-mock-redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - eliona-mock-redpanda-data:/var/lib/redpanda/data
  
  calculator:
    image: insolare/mockprocessor:latest
    container_name: eliona-mock-calculator
    networks:
      eliona-mock-network:
    depends_on:
      - redpanda
    environment:
      CONNECTION_STRING: postgres://postgres:secret@eliona-mock-database:5432
      BROKERS: eliona-mock-redpanda:9092
    restart: always

  debezium:
    image: debezium/connect:1.9
    container_name: debezium
    networks:
      eliona-mock-network:
    depends_on:
      - redpanda
      - database
    environment:
      BOOTSTRAP_SERVERS: eliona-mock-redpanda:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: eliona.debezium.configs
      OFFSET_STORAGE_TOPIC: eliona.debezium.offsets
      STATUS_STORAGE_TOPIC: eliona.debezium.statuses
    volumes:
      - ./init/debezium.sh:/debezium.sh
      - ./init/eliona-connector.json:/eliona-connector.json
    command:
      - /debezium.sh